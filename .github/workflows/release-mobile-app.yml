name: Release Nader AI Store APK

on:
  push:
    tags:
      - 'naderai-store-v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Release APK
        run: gradle :app:assembleRelease
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#naderai-store-v}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/naderai-store-v${{ steps.version.outputs.VERSION }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mobile-app/release/naderai-store-v${{ steps.version.outputs.VERSION }}.apk
          name: "Nader AI Store v${{ steps.version.outputs.VERSION }}"
          body: |
            Nader AI Store — تطبيق Android يعرض لوحة تحكم Nader AI ويقرأ رسائل Vodafone Cash تلقائيًا.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
