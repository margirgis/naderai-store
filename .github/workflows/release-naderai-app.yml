name: Release NaderAI APK

on:
  push:
    tags:
      - 'naderai-app-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasks/naderai-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Strip prefix "naderai-app-v" from tag
            echo "VERSION=${GITHUB_REF#refs/tags/naderai-app-v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Grant execute permission
        run: chmod +x ./gradlew || true

      - name: Build Release APK
        run: gradle :app:assembleRelease

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "naderai-app-v${{ steps.version.outputs.VERSION }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: naderai-app-v${{ steps.version.outputs.VERSION }}
          path: tasks/naderai-app/naderai-app-v${{ steps.version.outputs.VERSION }}.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: naderai-app-v${{ steps.version.outputs.VERSION }}
          name: "Nader AI v${{ steps.version.outputs.VERSION }}"
          body: |
            ## 🚀 Nader AI v${{ steps.version.outputs.VERSION }}

            ### ما الجديد في هذا الإصدار؟
            تطبيق **Nader AI** الجديد — الموقع الرسمي كاملاً داخل تطبيق Android مع نظام قراءة رسائل Vodafone Cash المدمج.

            ### ✨ المميزات
            - **موقع كامل** داخل التطبيق (WebView) — نفس تجربة الموقع بالضبط
            - **نظام قراءة SMS** مدمج: يقرأ رسائل Vodafone Cash ويؤكد الطلبات تلقائياً
            - **Foreground Service**: يعمل في الخلفية باستمرار بدون استهلاك بطارية
            - **JavaScript Bridge**: الموقع يتواصل مع نظام SMS مباشرة
            - **شاشة اختبار SMS**: للتحقق من أن نظام القراءة يعمل صحيحاً
            - **Heartbeat كل 120 ث**: تسجيل الجهاز وتحديث حالته في لوحة الأدمن
            - **Auto-start عند الإقلاع**: يبدأ تلقائياً بعد إعادة تشغيل الجهاز

            ### 📋 حالات الطلبات المدعومة
            - ✅ تم التأكيد تلقائياً (SMS مطابق)
            - ❌ فشل (SMS غير موجود)
            - ⚠️ مبلغ غير مطابق
            - 🔍 جاري البحث

            ### 🔧 متطلبات التثبيت
            - Android 8.0+ (API 26+)
            - صلاحيات: قراءة SMS، استقبال SMS، الإشعارات
            - السماح بالعمل في الخلفية (Battery Optimization Exemption)

            ### 📲 التثبيت
            حمّل الملف `naderai-app-v${{ steps.version.outputs.VERSION }}.apk` وثبّته على الجهاز
          files: tasks/naderai-app/naderai-app-v${{ steps.version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
